<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0A0B07" />
    <meta name="description" content="ZenFit — ovqatlanish va mashqni bitta AI orqali boshqaradigan shaxsiy hamroh." />
    <title>ZenFit</title>

    <!-- Gives window.Telegram.WebApp inside the Telegram client. src/telegram.js
         checks for it before use, so a plain browser tab still works. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Only html/body carry the colour — a background on #root would sit above
         the themed body and stay dark when the light theme is applied. */
      html, body, #root { height: 100%; margin: 0; }
      html, body { background: #0A0B07; }
      html[data-theme="light"], html[data-theme="light"] body { background: #F5F6F0; }
      body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    </style>

    <!-- Applied before first paint so a light-theme user never sees a dark flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("zenfit_theme") || "dark";
          var resolved = saved;
          if (saved === "system") {
            var tgScheme = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme;
            resolved = tgScheme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          }
          document.documentElement.setAttribute("data-theme", resolved);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", resolved === "light" ? "#F5F6F0" : "#0A0B07");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
